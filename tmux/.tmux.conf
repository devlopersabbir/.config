# =============================
# TMUX Modern Engineer Config
# =============================

# Set prefix to Ctrl-a (optional, like screen)
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Enable vi-style keybindings in copy mode
setw -g mode-keys vi

# Enable mouse support (click, scroll, resize)
set -g mouse on

# History & window index
set -g history-limit 10000
set -g base-index 1        # first window is 1

# Terminal type
set -g default-terminal "screen-256color"

# =============================
# Pane navigation & resizing
# =============================

# Pane navigation with prefix + hjkl
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing with prefix + Shift + hjkl
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# =============================
# Status bar customization
# =============================

# Status bar position
set -g status-position bottom
set -g status on
set -g status-interval 5

# Status bar colors
set -g status-bg colour235
set -g status-fg white

# Status bar length
set -g status-left-length 40
set -g status-right-length 120

# Nerd Font icons in status bar
set -g status-left "#[fg=yellow] #H "         # House icon + host
set -g status-right "#[fg=green] #(cut -d ' ' -f1 /proc/loadavg) #[fg=cyan] %Y-%m-%d %H:%M"  # CPU icon + date/time

# =============================
# Pane borders
# =============================
set -g pane-border-style fg=colour235        # inactive panes dim
set -g pane-active-border-style fg=colour51 # active pane bright
set -g pane-border-format "┃ #{pane_index} " # shows pane index

# =============================
# Copy mode scroll keys (vi-style)
# =============================
bind -T copy-mode-vi k send-keys -X cursor-up
bind -T copy-mode-vi j send-keys -X cursor-down
bind -T copy-mode-vi h send-keys -X cursor-left
bind -T copy-mode-vi l send-keys -X cursor-right

# =============================
# Reload tmux config easily
# =============================
bind r source-file ~/.tmux.conf \; display-message "TMUX config reloaded!"

# =============================
# Optional: maximize panes
# =============================
bind m resize-pane -Z

# =============================
# Optional: use vi-style keys for window navigation
# =============================
bind -n M-h previous-window
bind -n M-l next-window

