# =============================
# TMUX Configuration
# =============================

# Keep default prefix (Ctrl-b)
set -g prefix C-b
bind C-b send-prefix

# Enable mouse support (click, scroll, resize)
set -g mouse on

# History & window index
set -g history-limit 10000
set -g base-index 1        # first window is 1
setw -g pane-base-index 1   # first pane is 1

# Terminal type
set -g default-terminal "screen-256color"

# =============================
# Keybindings (Default Tmux)
# =============================
# All keybindings use standard Tmux defaults:
# - Prefix:          Ctrl-b
# - Pane Navigation: Ctrl-b + Arrow Keys
# - Pane Resize:     Ctrl-b + Alt+Arrow or Ctrl+Arrow
# - Toggle Zoom:     Ctrl-b + z
# - Last Window:     Ctrl-b + l
# - Split Vertical:  Ctrl-b + %
# - Split Horiz:     Ctrl-b + "
# - Kill Pane:       Ctrl-b + x
# - New Window:      Ctrl-b + c
# - Next/Prev Win:   Ctrl-b + n / Ctrl-b + p

# Easy reload of tmux config
bind r source-file ~/.tmux.conf \; display-message "TMUX config reloaded!"

# =============================
# Status bar customization
# =============================

# Status bar position
set -g status-position bottom
set -g status on
set -g status-interval 5

# Status bar colors
set -g status-bg colour235
set -g status-fg white

# Status bar length
set -g status-left-length 40
set -g status-right-length 120

# Nerd Font icons in status bar
set -g status-left "#[fg=yellow] #H "         # Host
set -g status-right "#[fg=green] #(sysctl -n vm.loadavg 2>/dev/null | awk '{print $2}' || cut -d ' ' -f1 /proc/loadavg 2>/dev/null) #[fg=cyan] %Y-%m-%d %H:%M"

# =============================
# Pane borders
# =============================
set -g pane-border-style fg=colour235        # inactive panes dim
set -g pane-active-border-style fg=colour51 # active pane bright
set -g pane-border-format "┃ #{pane_index} " # shows pane index
